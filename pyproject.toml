[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-analytics-solution"
version = "0.1.0"
description = "Ten-row Azure Databricks analytics teaching solution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["python-dotenv>=1.1,<2"]

[project.scripts]
solution = "provisioner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11",
    "prek>=0.3.9,<0.5",
]
cloud = ["azure-identity>=1.20,<2", "azure-storage-blob>=12.25,<13", "databricks-sdk>=0.60,<1"]

[tool.uv]
default-groups = ["dev", "cloud"]

[tool.hatch.build.targets.wheel]
packages = ["azure-terraform-provisioner/src/provisioner"]

[tool.pytest.ini_options]
testpaths = ["azure-terraform-provisioner/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "azure-terraform-provisioner/src",
    "databricks-etl-pipeline/src",
]
extend-exclude = [".runtime", ".terraform"]

[tool.ruff.lint]
select = ["F", "I001", "RUF022"]
ignore = ["E501", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
